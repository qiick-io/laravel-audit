name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, edited, synchronize, reopened]
  schedule:
    # Nightly full run: the pull request plan runs only what a change can break.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared PHP / Laravel matrix and database list (app-ui
  # docs/package-matrix.md). spatie/laravel-activitylog v5 requires PHP 8.4,
  # so this package excludes 8.3 (design §10, the one fleet exception).
  package-matrix:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      app-ui-ref: 0d97ae1429a856411c76e6de1ec258cae0eabab6
      exclude-php-versions: '["8.3"]'

  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    steps:
      - if: ${{ !matrix.skip }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: ${{ !matrix.skip }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Validate composer.json
        if: ${{ !matrix.skip }}
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        if: ${{ !matrix.skip }}
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
          TESTBENCH_MAJOR: ${{ matrix.testbench }}
          DEPENDENCY_VERSION: ${{ matrix.dependency-version }}
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${TESTBENCH_MAJOR}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:^${LARAVEL_MAJOR}.0" \
            "illuminate/contracts:^${LARAVEL_MAJOR}.0" \
            "illuminate/database:^${LARAVEL_MAJOR}.0" \
            "illuminate/http:^${LARAVEL_MAJOR}.0" \
            "illuminate/support:^${LARAVEL_MAJOR}.0"
          if [[ "$DEPENDENCY_VERSION" == lowest ]]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        if: ${{ !matrix.skip }}
        run: composer audit --no-interaction

      - name: Pest on SQLite
        if: ${{ !matrix.skip }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/pest

  lint:
    name: Pint
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.package-matrix.outputs.docs-only != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: needs.package-matrix.outputs.docs-only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - if: needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.package-matrix.outputs.docs-only != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: needs.package-matrix.outputs.docs-only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - if: needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

  # The package ships the activity_log migration and its queries (string-safe
  # morph scopes, chunked purge, anonymiser) differ by dialect: the whole suite
  # runs on each server engine of the shared list (design §7); SQLite runs in
  # every test cell.
  databases:
    name: Pest on ${{ matrix.database.name }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
    services:
      database:
        # An empty image starts no container on a pull request that does not need it.
        image: ${{ needs.package-matrix.outputs.run-databases == 'true' && matrix.database.image || '' }}
        env: ${{ matrix.database.environment }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - if: needs.package-matrix.outputs.run-databases == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: needs.package-matrix.outputs.run-databases == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_mysql, pdo_pgsql

      - name: Install dependencies
        if: needs.package-matrix.outputs.run-databases == 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest
        if: needs.package-matrix.outputs.run-databases == 'true'
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: qiick_package
          DB_USERNAME: ${{ matrix.database.username }}
          DB_PASSWORD: ${{ matrix.database.password }}
        run: vendor/bin/pest

  erasure:
    name: Erasure (E1–E14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - run: composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: node tests/Erasure/run.mjs

  # One pest --mutate invocation per source file (pcov, no --covered-only, no
  # || true), split round-robin across parallel shards. A pull request mutates
  # only the src/ files it changes; push and nightly mutate every file.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/4)
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Install dependencies
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate (per-class min 95)
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        env:
          MUTATE_SCOPE: ${{ needs.package-matrix.outputs.mutate-scope }}
          MUTATE_CLASSES: ${{ needs.package-matrix.outputs.mutate-classes }}
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 4
        run: bash scripts/mutate-per-class.sh

  # One stable check name over every shard, for branch protection: it fails
  # unless every shard succeeded (a cancelled or skipped shard fails it too).
  mutation:
    name: Mutation (per-class ≥95%)
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: test "$SHARDS_RESULT" = success

  standards:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0

  nightly-failure:
    needs: [package-matrix, tests, lint, phpstan, databases, erasure, mutation, standards]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failing run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly CI failed on $(date -u +%F)" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label bug
