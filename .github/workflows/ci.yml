name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # spatie/laravel-activitylog v5 requires PHP 8.4, so 8.3 is not in the matrix.
        php:
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

  # The package ships the activity_log migration and its queries (string-safe
  # morph scopes, chunked purge, anonymiser) differ by dialect: the whole suite
  # runs on each engine the fleet supports (design §7).
  databases:
    name: Pest on ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: SQLite
            connection: sqlite
            image: ''
            port: 0
            options: ''
          - name: MySQL 8.4
            connection: mysql
            image: mysql:8.4
            port: 3306
            options: >-
              -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=laravel_audit
              --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
          - name: MariaDB 10.11
            connection: mariadb
            image: mariadb:10.11
            port: 3306
            options: >-
              -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes -e MARIADB_DATABASE=laravel_audit
              --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
          - name: PostgreSQL 17
            connection: pgsql
            image: postgres:17
            port: 5432
            options: >-
              -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=laravel_audit
              --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    services:
      database:
        # An empty image skips the service container (the SQLite cell).
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: ${{ matrix.database.connection == 'sqlite' && ':memory:' || 'laravel_audit' }}
          DB_USERNAME: ${{ matrix.database.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ''
        run: vendor/bin/pest

  # One pest --mutate invocation per class (pcov, no --covered-only, no
  # || true), split round-robin across parallel shards so no job runs near its
  # timeout. Add a shard (and update MUTATE_SHARDS) before one passes 20 minutes.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate (per-class min 95)
        env:
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 4
        run: bash scripts/mutate-per-class.sh

  # One stable check name over every shard, for branch protection: it fails
  # unless every shard succeeded (a cancelled or skipped shard fails it too).
  mutation:
    name: Mutation (per-class ≥95%)
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutation-shards.result }}" = "success"

  standards:
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
